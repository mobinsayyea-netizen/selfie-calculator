name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare signing key (created once, then reused for every build)
        run: |
          KS="$RUNNER_TEMP/release.jks"
          if gh release download signing --pattern release.jks --output "$KS" --clobber; then
            echo "Reusing the saved signing key"
          else
            keytool -genkeypair -keystore "$KS" -storepass android123 -keypass android123 -alias key0 -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=App, O=App, C=IN"
            gh release create signing "$KS" --title "Signing key (do not delete)" --notes "Used to sign every build of this app so new versions install over old ones." --prerelease
          fi
          echo "KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: android123
          KEY_ALIAS: key0
          KEY_PASSWORD: android123
        run: |
          set +e
          yes | sdkmanager --licenses > /dev/null 2>&1
          gradle assembleRelease --stacktrace 2>&1 | tee build_output.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -iE -A3 "error:|^e: |What went wrong|Could not |FAILURE|cannot find symbol|does not exist|Execution failed" build_output.log | grep -v '^--$' | head -n 70 > errors_only.log
            if [ -s errors_only.log ]; then
              msg=$(head -c 6000 errors_only.log | tr -d '\r' | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
              echo "::error title=Gradle build failed::$msg"
            else
              echo "::error title=Gradle build failed::Build failed with exit code $status but no obvious error line was found."
            fi
            exit 1
          fi

      - name: Publish release (direct APK download link)
        run: |
          cp app/build/outputs/apk/release/app-release.apk "SelfieCalculator.apk"
          gh release create "build-${{ github.run_number }}" "SelfieCalculator.apk" --title "Selfie Calculator build ${{ github.run_number }}" --notes "Automated build."
